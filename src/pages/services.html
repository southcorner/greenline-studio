{{> nav}}

<main class="snap" id="main">
  <section class="sc" id="top">
    <div class="wrap split">
      <div class="stack">
        <p class="eye rv">What we do</p>
        <h1 class="rv">{{{services.sint_h1_before}}}<span class="u">{{services.sint_h1_highlight}}</span></h1>
        <p class="lede wide-only rv">{{services.sint_desc}}</p>
      </div>
      <ol class="svc-index rv" aria-label="Services on this page">{{{gen.svc_index}}}</ol>
    </div>
  </section>

  {{{gen.svc_screens}}}

  <section class="sc" id="engage">
    <div class="wrap split">
      <div class="stack">
        <p class="eye rv">How we engage</p>
        <h2 class="rv">{{services.pricing_h2}}</h2>
      </div>
      <ol class="steps">
          {{{gen.tiers}}}
      </ol>
    </div>
  </section>

  <section class="sc end" id="contact">
    <div class="wrap stack end-body">
      <p class="eye rv">Contact us</p>
      <h2 class="rv">{{services.cta_h2}}</h2>
      <p class="lede rv">{{services.cta_sub}}</p>
      <div class="cta-row rv">
        <a class="btn" href="/contact" id="cta-send">Send a message</a>
        <button class="mail" type="button" id="cta-copy" data-copy="{{site.email}}">{{site.email}}<span>Copy</span></button>
      </div>
    </div>
    <div class="wrap">{{> footer}}</div>
  </section>
</main>
